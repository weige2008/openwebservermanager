name: build-and-release

on:
  push:
    branches:
      - main
    tags:
      - 'v*.*.*'
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  guacd-linux-amd64:
    name: build bundled guacd linux-amd64
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install guacd build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            autoconf automake build-essential curl git libtool pkg-config \
            libcairo2-dev freerdp2-dev libgcrypt20-dev libjpeg-turbo8-dev \
            libpng-dev libssl-dev libuuid1 uuid-dev libvncserver-dev libwebp-dev

      - name: Build portable guacd runtime
        run: bash scripts/guacd/build-linux.sh runtime/guacd/linux

      - name: Smoke test RDP and VNC plugins
        run: bash scripts/guacd/test-linux-runtime.sh runtime/guacd/linux

      - name: Upload guacd runtime
        uses: actions/upload-artifact@v4
        with:
          name: guacd-linux-amd64
          path: runtime/guacd/linux
          if-no-files-found: error

  guacd-windows-amd64:
    name: build bundled guacd windows-amd64
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build portable guacd runtime
        shell: pwsh
        run: ./scripts/guacd/build-windows-cygwin.ps1 -OutputDir runtime/guacd/windows -WorkDir "$env:RUNNER_TEMP/openwebservermanager-guacd-windows"

      - name: Smoke test RDP and VNC plugins
        shell: pwsh
        run: ./scripts/guacd/test-windows-runtime.ps1 -RuntimeDir runtime/guacd/windows

      - name: Upload guacd runtime
        uses: actions/upload-artifact@v4
        with:
          name: guacd-windows-amd64
          path: runtime/guacd/windows
          if-no-files-found: error

  build:
    name: build ${{ matrix.goos }}-${{ matrix.goarch }}
    runs-on: ubuntu-latest
    needs:
      - guacd-linux-amd64
      - guacd-windows-amd64
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
            ext: ''
            archive: tar.gz
          - goos: linux
            goarch: arm64
            ext: ''
            archive: tar.gz
          - goos: windows
            goarch: amd64
            ext: '.exe'
            archive: zip
          - goos: windows
            goarch: arm64
            ext: '.exe'
            archive: zip
          - goos: darwin
            goarch: amd64
            ext: ''
            archive: tar.gz
          - goos: darwin
            goarch: arm64
            ext: ''
            archive: tar.gz

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          cache: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm --prefix frontend ci

      - name: Audit frontend dependencies
        if: matrix.goos == 'linux' && matrix.goarch == 'amd64'
        run: npm --prefix frontend audit

      - name: Build frontend
        run: npm --prefix frontend run build

      - name: Test Go packages
        run: go test ./...

      - name: Download Linux guacd runtime
        if: matrix.goos == 'linux' && matrix.goarch == 'amd64'
        uses: actions/download-artifact@v4
        with:
          name: guacd-linux-amd64
          path: runtime/guacd/linux

      - name: Download Windows guacd runtime
        if: matrix.goos == 'windows' && matrix.goarch == 'amd64'
        uses: actions/download-artifact@v4
        with:
          name: guacd-windows-amd64
          path: runtime/guacd/windows

      - name: Scan Go vulnerabilities
        if: matrix.goos == 'linux' && matrix.goarch == 'amd64'
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.5.0 ./...

      - name: Build binary
        shell: bash
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: '0'
        run: |
          set -euo pipefail
          version="$(cat VERSION)"
          if [[ "${GITHUB_REF_TYPE}" == "tag" && "${GITHUB_REF_NAME}" == v* ]]; then
            version="${GITHUB_REF_NAME#v}"
          fi
          package="openwebservermanager-${version}-${GOOS}-${GOARCH}"
          stage="dist/${package}"
          mkdir -p "${stage}"
          go build -trimpath \
            -ldflags "-s -w -X main.version=${version} -X main.commit=${GITHUB_SHA}" \
            -o "${stage}/openwebservermanager${{ matrix.ext }}" \
            ./cmd/openwebservermanager
          go build -trimpath \
            -ldflags "-s -w -X main.version=${version} -X main.commit=${GITHUB_SHA}" \
            -o "${stage}/openwebservermanager-agent${{ matrix.ext }}" \
            ./cmd/openwebservermanager-agent
          cp README.md DEPLOYMENT.md VERSION "${stage}/"
          cp -R docs "${stage}/docs"
          cp -R runtime "${stage}/runtime"
          if [[ "${GOOS}-${GOARCH}" == "linux-amd64" ]]; then
            test -x "${stage}/runtime/guacd/linux/bin/guacd"
            test -f "${stage}/runtime/guacd/linux/lib/libguac-client-rdp.so"
            test -f "${stage}/runtime/guacd/linux/lib/libguac-client-vnc.so"
          fi
          if [[ "${GOOS}-${GOARCH}" == "windows-amd64" ]]; then
            test -f "${stage}/runtime/guacd/windows/bin/guacd.exe"
            test -f "${stage}/runtime/guacd/windows/bin/libguac-client-rdp.so"
            test -f "${stage}/runtime/guacd/windows/bin/libguac-client-vnc.so"
          fi
          if [[ "${{ matrix.archive }}" == "zip" ]]; then
            export STAGE="${stage}"
            python - <<'PY'
          import os
          import zipfile
          from pathlib import Path

          stage = Path(os.environ["STAGE"])
          archive = Path("dist") / f"{stage.name}.zip"
          with zipfile.ZipFile(archive, "w", zipfile.ZIP_DEFLATED) as zf:
              for path in stage.rglob("*"):
                  if path.is_file():
                      zf.write(path, path.relative_to(stage.parent))
          PY
          else
            tar -C dist -czf "dist/${package}.tar.gz" "${package}"
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: openwebservermanager-${{ matrix.goos }}-${{ matrix.goarch }}
          path: |
            dist/*.tar.gz
            dist/*.zip
          if-no-files-found: error

  release:
    name: publish GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Create release notes
        run: |
          tag="${GITHUB_REF_NAME}"
          version="${tag#v}"
          cat > RELEASE_NOTES.md <<EOF
          openwebservermanager ${version}

          - Cross-platform openwebservermanager manager and Agent binaries for Linux, Windows, and macOS.
          - Bundled static web frontend.
          - Linux amd64 and Windows amd64 packages include tested Apache Guacamole guacd runtimes with RDP and VNC plugins.
          - Other architectures can use an externally managed guacd through OPENWEBSERVERMANAGER_GUACD_HOST and OPENWEBSERVERMANAGER_GUACD_PORT.
          EOF

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" release-assets/* \
            --title "openwebservermanager ${GITHUB_REF_NAME#v}" \
            --notes-file RELEASE_NOTES.md
